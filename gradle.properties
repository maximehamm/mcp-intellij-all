kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=false
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx2g
# IntelliJ 2026.2 EAP (build 262) bundles translation plugins that pollute the test classpath and
# break headless BasePlatformTestCase runs. Exclude them (harmless on older IDEs).
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes=com.intellij.ja,com.intellij.ko,com.intellij.zh
